
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download actual pull request diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.diff" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" \
            -o "$RUNNER_TEMP/pr.diff"

          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "Pull request diff is empty."
            exit 1
          fi

          head -c 50000 "$RUNNER_TEMP/pr.diff" > pr.diff
          echo "Downloaded diff size:"
          wc -c pr.diff

      - name: Run AI code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DIFF_FILE: pr.diff
        run: python review.py

      - name: Publish review on Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          report = Path("review.md").read_text(encoding="utf-8")
          body = "## AI Code Review\n\n" + report
          body = body[:60000]

          url = (
              f"https://api.github.com/repos/"
              f"{os.environ['REPOSITORY']}/issues/"
              f"{os.environ['PR_NUMBER']}/comments"
          )

          payload = json.dumps({"body": body}).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print("Review comment posted. HTTP", response.status)
          PY
